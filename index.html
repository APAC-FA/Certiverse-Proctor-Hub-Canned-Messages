<!DOCTYPE html>
<html lang="en"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Certiverse Proctor Hub — Canned Messages</title>
<style>
  :root{
    --bg:#0F1419;
    --panel:#161C25;
    --panel-2:#1C232E;
    --border:#2A323D;
    --text:#E8EAED;
    --text-dim:#8B95A1;
    --text-faint:#5B6470;
    --accent:#4FD1C5;
    --accent-dim:#2B4A47;
    --amber:#F0A868;
    --amber-dim:#4A3A22;
    --red:#E8636F;
    --red-dim:#4A2429;
    --green:#6FCF97;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .topbar{
    position:sticky; top:0; z-index:10;
    background:rgba(15,20,25,0.96);
    backdrop-filter:blur(6px);
    border-bottom:1px solid var(--border);
    padding:14px 20px;
  }
  .topbar-inner{ max-width:980px; margin:0 auto; }
  .title-row{
    display:flex; align-items:center; gap:10px; margin-bottom:12px;
  }
  .dot{
    width:8px; height:8px; border-radius:50%; background:var(--accent);
    box-shadow:0 0 0 3px var(--accent-dim);
    flex-shrink:0;
  }
  .dot.editing{ background:var(--amber); box-shadow:0 0 0 3px var(--amber-dim); }
  h1{
    font-family:'IBM Plex Mono',monospace;
    font-size:14px; font-weight:600; letter-spacing:0.04em;
    text-transform:uppercase; margin:0; color:var(--text);
  }
  .subtitle{
    font-size:12px; color:var(--text-faint);
    font-family:'IBM Plex Mono',monospace;
  }
  .spacer{ margin-left:auto; display:flex; align-items:center; gap:10px; }
  .edit-toggle{
    font-family:'IBM Plex Mono',monospace;
    font-size:11.5px;
    color:var(--text-dim);
    background:var(--panel);
    border:1px solid var(--border);
    padding:6px 10px;
    border-radius:6px;
    cursor:pointer;
    display:flex; align-items:center; gap:6px;
    white-space:nowrap;
  }
  .edit-toggle:hover{ border-color:var(--text-faint); color:var(--text); }
  .edit-toggle.active{ background:var(--amber-dim); border-color:var(--amber); color:var(--amber); }
  .save-status{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px; color:var(--text-faint);
    white-space:nowrap;
  }
  .save-status.saving{ color:var(--amber); }
  .save-status.saved{ color:var(--green); }
  .search-wrap{ position:relative; }
  #search{
    width:100%;
    background:var(--panel);
    border:1px solid var(--border);
    color:var(--text);
    font-size:15px;
    padding:12px 44px 12px 40px;
    border-radius:8px;
    outline:none;
    font-family:'IBM Plex Mono',monospace;
  }
  #search:focus{ border-color:var(--accent); }
  #search::placeholder{ color:var(--text-faint); }
  .search-icon{
    position:absolute; left:14px; top:50%; transform:translateY(-50%);
    color:var(--text-faint); font-size:15px; pointer-events:none;
  }
  .kbd-hint{
    position:absolute; right:10px; top:50%; transform:translateY(-50%);
    font-size:11px; color:var(--text-faint);
    border:1px solid var(--border); border-radius:4px; padding:2px 6px;
    font-family:'IBM Plex Mono',monospace;
    pointer-events:none;
  }
  .tab-scroller{
    max-width:980px; margin:12px auto 0;
    display:flex; gap:8px; overflow-x:auto; padding-bottom:2px;
    scrollbar-width:thin;
    align-items:center;
  }
  .tab-pill{
    flex-shrink:0;
    font-family:'IBM Plex Mono',monospace;
    font-size:13px;
    font-weight:600;
    letter-spacing:0.02em;
    color:var(--text-dim);
    background:var(--panel);
    border:1px solid var(--border);
    padding:8px 16px;
    border-radius:8px;
    cursor:pointer;
    white-space:nowrap;
    transition:all .12s ease;
  }
  .tab-pill:hover{ border-color:var(--text-faint); color:var(--text); }
  .tab-pill.active{ background:var(--accent-dim); border-color:var(--accent); color:var(--accent); }
  .tab-pill.add-tab{ color:var(--accent); border-style:dashed; }
  .category-scroller{
    max-width:980px; margin:10px auto 0;
    display:flex; gap:6px; overflow-x:auto; padding-bottom:2px;
    scrollbar-width:thin;
    align-items:center;
  }
  .cat-pill{
    flex-shrink:0;
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    color:var(--text-dim);
    background:var(--panel);
    border:1px solid var(--border);
    padding:6px 12px;
    border-radius:20px;
    cursor:pointer;
    white-space:nowrap;
    transition:all .12s ease;
  }
  .cat-pill:hover{ border-color:var(--text-faint); color:var(--text); }
  .cat-pill.active{ background:var(--accent-dim); border-color:var(--accent); color:var(--accent); }
  .cat-pill.add-cat{ color:var(--accent); border-style:dashed; }

  main{ max-width:980px; margin:0 auto; padding:18px 20px 80px; }
  .empty-state{
    text-align:center; padding:60px 20px; color:var(--text-faint);
    font-family:'IBM Plex Mono',monospace; font-size:13px;
  }
  .section-heading{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px; letter-spacing:0.06em; text-transform:uppercase;
    color:var(--text-faint);
    margin:28px 0 10px;
    display:flex; align-items:center; gap:8px;
  }
  .section-heading:first-child{ margin-top:0; }
  .section-heading .num{
    color:var(--accent);
  }
  .add-msg-btn{
    margin-left:auto;
    font-family:'IBM Plex Mono',monospace;
    font-size:11px; color:var(--accent);
    background:var(--accent-dim);
    border:1px solid var(--accent);
    padding:3px 9px;
    border-radius:5px;
    cursor:pointer;
    text-transform:none;
    letter-spacing:normal;
  }
  .del-cat-btn{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px; color:var(--red);
    background:var(--red-dim);
    border:1px solid var(--red);
    padding:3px 9px;
    border-radius:5px;
    cursor:pointer;
  }
  .card{
    background:var(--panel);
    border:1px solid var(--border);
    border-left:3px solid var(--border);
    border-radius:6px;
    padding:12px 14px;
    margin-bottom:8px;
    cursor:pointer;
    transition:background .12s ease, border-color .12s ease;
    display:flex;
    gap:12px;
    align-items:flex-start;
  }
  .card:hover{ background:var(--panel-2); border-left-color:var(--accent); }
  .card.copied{ border-left-color:var(--green); }
  .card.cat-warning{ border-left-color:var(--amber); }
  .card.cat-warning:hover{ border-left-color:var(--amber); background:var(--amber-dim); }
  .card.cat-termination{ border-left-color:var(--red); }
  .card.cat-termination:hover{ border-left-color:var(--red); background:var(--red-dim); }
  .card.editing-item{ cursor:default; }

  .card-body{ flex:1; min-width:0; }
  .card-text{ font-size:14.5px; line-height:1.5; color:var(--text); white-space:pre-wrap; }
  .card-meta{
    display:flex; align-items:center; gap:8px; margin-top:8px; flex-wrap:wrap;
  }
  .tag{
    font-family:'IBM Plex Mono',monospace;
    font-size:11.5px;
    color:var(--accent);
    background:var(--accent-dim);
    padding:2px 8px;
    border-radius:10px;
  }
  .os-badge{
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;
    color:var(--text-dim);
    border:1px solid var(--border);
    padding:1px 6px;
    border-radius:4px;
    letter-spacing:0.03em;
  }
  .copy-btn, .icon-btn{
    flex-shrink:0;
    width:34px; height:34px;
    border-radius:6px;
    background:var(--panel-2);
    border:1px solid var(--border);
    color:var(--text-dim);
    display:flex; align-items:center; justify-content:center;
    font-size:15px;
    cursor:pointer;
  }
  .card:hover .copy-btn{ color:var(--accent); border-color:var(--accent); }
  .card.copied .copy-btn{ color:var(--green); border-color:var(--green); }
  .icon-btn.edit-icon:hover{ color:var(--accent); border-color:var(--accent); }
  .icon-btn.del-icon:hover{ color:var(--red); border-color:var(--red); }
  .card-actions{ display:flex; flex-direction:column; gap:6px; }

  .edit-textarea{
    width:100%;
    background:var(--panel-2);
    border:1px solid var(--accent);
    color:var(--text);
    font-family:inherit;
    font-size:14.5px;
    line-height:1.5;
    border-radius:6px;
    padding:8px 10px;
    resize:vertical;
    min-height:60px;
  }
  .edit-row{ display:flex; gap:8px; margin-top:8px; }
  .edit-row input{
    background:var(--panel-2);
    border:1px solid var(--border);
    color:var(--text);
    font-family:'IBM Plex Mono',monospace;
    font-size:11.5px;
    padding:4px 8px;
    border-radius:5px;
  }
  .edit-btn{
    font-family:'IBM Plex Mono',monospace;
    font-size:11.5px;
    padding:5px 10px;
    border-radius:5px;
    cursor:pointer;
    border:1px solid var(--border);
    background:var(--panel-2);
    color:var(--text-dim);
  }
  .edit-btn.primary{ color:var(--accent); border-color:var(--accent); background:var(--accent-dim); }
  .edit-btn.danger{ color:var(--red); border-color:var(--red); background:var(--red-dim); }

  .toast{
    position:fixed; bottom:22px; left:50%; transform:translateX(-50%) translateY(20px);
    background:var(--panel-2); border:1px solid var(--green); color:var(--green);
    font-family:'IBM Plex Mono',monospace; font-size:13px;
    padding:10px 18px; border-radius:8px;
    opacity:0; pointer-events:none;
    transition:all .18s ease;
    z-index:50;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  .modal-overlay{
    position:fixed; inset:0; background:rgba(0,0,0,0.6);
    display:none; align-items:center; justify-content:center; z-index:100;
    padding:20px;
  }
  .modal-overlay.show{ display:flex; }
  .modal{
    background:var(--panel); border:1px solid var(--border); border-radius:10px;
    padding:22px; max-width:360px; width:100%;
  }
  .modal h2{
    font-family:'IBM Plex Mono',monospace; font-size:13px; letter-spacing:0.04em;
    text-transform:uppercase; color:var(--text); margin:0 0 6px;
  }
  .modal p{ font-size:12.5px; color:var(--text-faint); margin:0 0 14px; line-height:1.5; }
  .modal input{
    width:100%; background:var(--panel-2); border:1px solid var(--border);
    color:var(--text); font-family:'IBM Plex Mono',monospace; font-size:14px;
    padding:10px 12px; border-radius:6px; outline:none; margin-bottom:10px;
  }
  .modal input:focus{ border-color:var(--accent); }
  .modal-actions{ display:flex; gap:8px; justify-content:flex-end; margin-top:6px; }
  .modal-error{ color:var(--red); font-size:12px; margin:-4px 0 10px; display:none; }
  .modal-error.show{ display:block; }

  .loading-state{
    text-align:center; padding:60px 20px; color:var(--text-faint);
    font-family:'IBM Plex Mono',monospace; font-size:13px;
  }

  ::-webkit-scrollbar{ height:6px; width:6px; }
  ::-webkit-scrollbar-thumb{ background:var(--border); border-radius:3px; }

  @media (max-width:600px){
    h1{ font-size:12px; }
    .subtitle{ display:none; }
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-inner">
    <div class="title-row">
      <span class="dot" id="statusDot"></span>
      <h1>Certiverse Proctor Hub</h1>
      <span class="subtitle">Canned Messages</span>
      <div class="spacer">
        <span class="save-status" id="saveStatus"></span>
        <div class="edit-toggle" id="editToggle">🔒 Edit</div>
      </div>
    </div>
    <div class="search-wrap">
      <span class="search-icon">⌕</span>
      <input id="search" type="text" placeholder="Type # for a shortcut, or search by keyword…" autocomplete="off">
      <span class="kbd-hint">/</span>
    </div>
    <div class="tab-scroller" id="tabScroller"></div>
    <div class="category-scroller" id="catScroller"></div>
  </div>
</div>

<main id="main"><div class="loading-state">Loading messages…</div></main>

<div class="toast" id="toast">Copied to clipboard</div>

<div class="modal-overlay" id="passModal">
  <div class="modal">
    <h2 id="passModalTitle">Enter edit passcode</h2>
    <p id="passModalDesc">This gate is just a light deterrent, not real security — anyone with the passcode can edit. Everyone can still view the page without it.</p>
    <div class="modal-error" id="passModalError">Incorrect passcode.</div>
    <input type="password" id="passInput" placeholder="Passcode" autocomplete="off">
    <div class="modal-actions">
      <div class="edit-btn" id="passCancel">Cancel</div>
      <div class="edit-btn primary" id="passSubmit">Unlock</div>
    </div>
  </div>
</div>

const STORAGE_KEY = 'certiverse-canned-messages-v2-tabs';
const PASS_KEY = 'certiverse-canned-messages-editpass';

let TABS = [];
let activeTabId = null;
let activeCat = 'all';
let isEditMode = false;
let editPasscode = null; // known passcode fetched from shared storage (null = not yet checked / not set)
let editingItemKey = null; // "tabId|cat|tag" currently being edited inline

const main = document.getElementById('main');
const searchInput = document.getElementById('search');
const tabScroller = document.getElementById('tabScroller');
const catScroller = document.getElementById('catScroller');
const toast = document.getElementById('toast');
const editToggle = document.getElementById('editToggle');
const saveStatus = document.getElementById('saveStatus');
const statusDot = document.getElementById('statusDot');
const passModal = document.getElementById('passModal');
const passInput = document.getElementById('passInput');
const passModalError = document.getElementById('passModalError');
const passModalTitle = document.getElementById('passModalTitle');
const passModalDesc = document.getElementById('passModalDesc');

function currentTab(){
  return TABS.find(t => t.id === activeTabId) || TABS[0];
}

async function loadData(){
  try{
    const result = await window.storage.get(STORAGE_KEY, true);
    TABS = result && result.value ? JSON.parse(result.value) : null;
  }catch(e){
    TABS = null;
  }
  if(!TABS){
    TABS = JSON.parse(JSON.stringify(DEFAULT_TABS));
    try{ await window.storage.set(STORAGE_KEY, JSON.stringify(TABS), true); }catch(e){}
  }
  activeTabId = TABS[0] ? TABS[0].id : null;
  buildTabPills();
  buildCatPills();
  render();
}

async function saveData(){
  saveStatus.textContent = 'Saving…';
  saveStatus.className = 'save-status saving';
  try{
    await window.storage.set(STORAGE_KEY, JSON.stringify(TABS), true);
    saveStatus.textContent = 'Saved';
    saveStatus.className = 'save-status saved';
    setTimeout(() => { if(saveStatus.textContent === 'Saved') saveStatus.textContent = ''; }, 1600);
  }catch(e){
    saveStatus.textContent = 'Save failed — try again';
    saveStatus.className = 'save-status';
  }
}

function buildTabPills(){
  tabScroller.innerHTML = '';
  TABS.forEach(tab => {
    const pill = document.createElement('div');
    pill.className = 'tab-pill' + (activeTabId === tab.id ? ' active' : '');
    pill.textContent = tab.label;
    pill.dataset.tabId = tab.id;
    tabScroller.appendChild(pill);
  });
  if(isEditMode){
    const addPill = document.createElement('div');
    addPill.className = 'tab-pill add-tab';
    addPill.textContent = '+ Tab';
    addPill.addEventListener('click', addTab);
    tabScroller.appendChild(addPill);
  }
}

tabScroller.addEventListener('click', e => {
  const pill = e.target.closest('.tab-pill');
  if(!pill || pill.classList.contains('add-tab')) return;
  activeTabId = pill.dataset.tabId;
  activeCat = 'all';
  editingItemKey = null;
  buildTabPills();
  buildCatPills();
  render();
});

function buildCatPills(){
  catScroller.innerHTML = '';
  const tab = currentTab();
  const allPill = document.createElement('div');
  allPill.className = 'cat-pill' + (activeCat === 'all' ? ' active' : '');
  allPill.textContent = 'All';
  allPill.dataset.cat = 'all';
  catScroller.appendChild(allPill);
  if(tab){
    tab.sections.forEach(section => {
      const pill = document.createElement('div');
      pill.className = 'cat-pill' + (activeCat === section.cat ? ' active' : '');
      pill.textContent = section.catName;
      pill.dataset.cat = section.cat;
      catScroller.appendChild(pill);
    });
  }
  if(isEditMode){
    const addPill = document.createElement('div');
    addPill.className = 'cat-pill add-cat';
    addPill.textContent = '+ Category';
    addPill.addEventListener('click', addCategory);
    catScroller.appendChild(addPill);
  }
}

catScroller.addEventListener('click', e => {
  const pill = e.target.closest('.cat-pill');
  if(!pill || pill.classList.contains('add-cat')) return;
  activeCat = pill.dataset.cat;
  [...catScroller.children].forEach(c => c.classList.toggle('active', c === pill));
  render();
});

function matches(item, query){
  if(!query) return true;
  const q = query.replace(/^#/, '').toLowerCase().trim();
  if(!q) return true;
  return item.tag.toLowerCase().includes(q) || item.text.toLowerCase().includes(q);
}

function render(){
  const query = searchInput.value;
  const tab = currentTab();
  main.innerHTML = '';
  let anyResults = false;

  if(!tab){
    main.innerHTML = '<div class="empty-state">No tabs yet. Switch to edit mode to add one.</div>';
    return;
  }

  tab.sections.forEach(section => {
    if(activeCat !== 'all' && section.cat !== activeCat) return;
    const filteredItems = section.items.filter(item => matches(item, query));
    if(filteredItems.length === 0 && !(isEditMode && activeCat === section.cat)) return;
    anyResults = true;

    const heading = document.createElement('div');
    heading.className = 'section-heading';
    heading.innerHTML = `${section.catName}${section.note ? ' <span class="tag" style="margin-left:4px">'+section.note+'</span>' : ''}`;
    if(isEditMode){
      const addBtn = document.createElement('div');
      addBtn.className = 'add-msg-btn';
      addBtn.textContent = '+ Message';
      addBtn.addEventListener('click', () => addItem(section));
      heading.appendChild(addBtn);
      const delCatBtn = document.createElement('div');
      delCatBtn.className = 'del-cat-btn';
      delCatBtn.textContent = 'Delete category';
      delCatBtn.addEventListener('click', () => deleteCategory(section));
      heading.appendChild(delCatBtn);
    }
    main.appendChild(heading);

    filteredItems.forEach(item => {
      const key = tab.id + '|' + section.cat + '|' + item.tag;
      const card = document.createElement('div');
      card.className = 'card' + (section.color === 'warning' ? ' cat-warning' : '') + (section.color === 'termination' ? ' cat-termination' : '');

      if(isEditMode && editingItemKey === key){
        card.classList.add('editing-item');
        const body = document.createElement('div');
        body.className = 'card-body';

        const textarea = document.createElement('textarea');
        textarea.className = 'edit-textarea';
        textarea.value = item.text;
        body.appendChild(textarea);

        const row = document.createElement('div');
        row.className = 'edit-row';
        const tagInput = document.createElement('input');
        tagInput.placeholder = 'tag';
        tagInput.value = item.tag;
        row.appendChild(tagInput);
        const osInput = document.createElement('input');
        osInput.placeholder = 'OS badge (optional)';
        osInput.value = item.os || '';
        row.appendChild(osInput);
        body.appendChild(row);

        const actions = document.createElement('div');
        actions.className = 'edit-row';
        const saveBtn = document.createElement('div');
        saveBtn.className = 'edit-btn primary';
        saveBtn.textContent = 'Save';
        saveBtn.addEventListener('click', async () => {
          item.text = textarea.value.trim() || item.text;
          item.tag = tagInput.value.trim() || item.tag;
          item.os = osInput.value.trim() || undefined;
          editingItemKey = null;
          await saveData();
          render();
        });
        const cancelBtn = document.createElement('div');
        cancelBtn.className = 'edit-btn';
        cancelBtn.textContent = 'Cancel';
        cancelBtn.addEventListener('click', () => { editingItemKey = null; render(); });
        const deleteBtn = document.createElement('div');
        deleteBtn.className = 'edit-btn danger';
        deleteBtn.textContent = 'Delete';
        deleteBtn.addEventListener('click', async () => {
          if(!confirm('Delete this message?')) return;
          section.items = section.items.filter(i => i !== item);
          editingItemKey = null;
          await saveData();
          render();
        });
        actions.appendChild(saveBtn);
        actions.appendChild(cancelBtn);
        actions.appendChild(deleteBtn);
        body.appendChild(actions);

        card.appendChild(body);
        main.appendChild(card);
        return;
      }

      const body = document.createElement('div');
      body.className = 'card-body';

      const text = document.createElement('div');
      text.className = 'card-text';
      text.textContent = item.text;
      body.appendChild(text);

      const meta = document.createElement('div');
      meta.className = 'card-meta';
      const tag = document.createElement('span');
      tag.className = 'tag';
      tag.textContent = '#' + item.tag;
      meta.appendChild(tag);
      if(item.os){
        const osBadge = document.createElement('span');
        osBadge.className = 'os-badge';
        osBadge.textContent = item.os;
        meta.appendChild(osBadge);
      }
      body.appendChild(meta);

      card.appendChild(body);

      if(isEditMode){
        const actions = document.createElement('div');
        actions.className = 'card-actions';
        const editBtn = document.createElement('div');
        editBtn.className = 'icon-btn edit-icon';
        editBtn.textContent = '✎';
        editBtn.title = 'Edit';
        editBtn.addEventListener('click', ev => { ev.stopPropagation(); editingItemKey = key; render(); });
        const delBtn = document.createElement('div');
        delBtn.className = 'icon-btn del-icon';
        delBtn.textContent = '🗑';
        delBtn.title = 'Delete';
        delBtn.addEventListener('click', async ev => {
          ev.stopPropagation();
          if(!confirm('Delete this message?')) return;
          section.items = section.items.filter(i => i !== item);
          await saveData();
          render();
        });
        actions.appendChild(editBtn);
        actions.appendChild(delBtn);
        card.appendChild(actions);
      } else {
        const btn = document.createElement('div');
        btn.className = 'copy-btn';
        btn.textContent = '⧉';
        card.appendChild(btn);
        card.addEventListener('click', () => copyMessage(item.text, card));
      }

      main.appendChild(card);
    });
  });

  if(!anyResults){
    main.innerHTML = '<div class="empty-state">No messages match that search. Try a different keyword or shortcut.</div>';
  }
}

async function addItem(section){
  const text = prompt('New message text:');
  if(text === null || text.trim() === '') return;
  const tag = prompt('Short tag for this message (used for search, e.g. "welcome-new"):', '');
  section.items.push({tag: (tag || 'new-message').trim(), text: text.trim()});
  await saveData();
  render();
}

async function addCategory(){
  const tab = currentTab();
  if(!tab) return;
  const name = prompt('Category name (e.g. "Escalations"):');
  if(name === null || name.trim() === '') return;
  const id = tab.id.toUpperCase() + '-' + (tab.sections.length + 1) + '-' + Date.now().toString(36).slice(-4);
  tab.sections.push({cat: id, catName: name.trim(), color:'', items: []});
  activeCat = id;
  await saveData();
  buildCatPills();
  render();
}

async function deleteCategory(section){
  const tab = currentTab();
  if(!confirm(`Delete the "${section.catName}" category and all ${section.items.length} message(s) in it?`)) return;
  tab.sections = tab.sections.filter(s => s !== section);
  if(activeCat === section.cat) activeCat = 'all';
  await saveData();
  buildCatPills();
  render();
}

async function addTab(){
  const label = prompt('New tab name (e.g. "Special Accommodations"):');
  if(label === null || label.trim() === '') return;
  const id = 'tab-' + Date.now().toString(36);
  TABS.push({id, label: label.trim(), sections: []});
  activeTabId = id;
  activeCat = 'all';
  await saveData();
  buildTabPills();
  buildCatPills();
  render();
}

function copyMessage(text, card){
  navigator.clipboard.writeText(text).then(() => {
    showToast();
    card.classList.add('copied');
    setTimeout(() => card.classList.remove('copied'), 700);
  }).catch(() => {
    const ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    showToast();
  });
}

let toastTimer;
function showToast(){
  clearTimeout(toastTimer);
  toast.classList.add('show');
  toastTimer = setTimeout(() => toast.classList.remove('show'), 1400);
}

searchInput.addEventListener('input', render);

document.addEventListener('keydown', e => {
  if(e.key === '/' && document.activeElement !== searchInput){
    e.preventDefault();
    searchInput.focus();
  }
  if(e.key === 'Escape'){
    if(passModal.classList.contains('show')){ closePassModal(); return; }
    searchInput.value = '';
    searchInput.blur();
    render();
  }
});

// --- Edit-mode passcode gate ---
editToggle.addEventListener('click', async () => {
  if(isEditMode){
    isEditMode = false;
    editingItemKey = null;
    updateEditUI();
    buildTabPills();
    buildCatPills();
    render();
    return;
  }
  await openPassModal();
});

async function openPassModal(){
  let stored = null;
  try{
    const result = await window.storage.get(PASS_KEY, true);
    stored = result ? result.value : null;
  }catch(e){ stored = null; }
  editPasscode = stored;

  if(editPasscode){
    passModalTitle.textContent = 'Enter edit passcode';
    passModalDesc.textContent = 'This gate is a light deterrent, not real security — anyone with the passcode can edit. Everyone can still view the page without it.';
  } else {
    passModalTitle.textContent = 'Set an edit passcode';
    passModalDesc.textContent = 'No passcode has been set yet. Choose one now — you\u2019ll need it (and anyone else editing will need it) going forward. Viewing never requires it.';
  }
  passModalError.classList.remove('show');
  passInput.value = '';
  passModal.classList.add('show');
  setTimeout(() => passInput.focus(), 50);
}

function closePassModal(){
  passModal.classList.remove('show');
}

document.getElementById('passCancel').addEventListener('click', closePassModal);
document.getElementById('passSubmit').addEventListener('click', submitPass);
passInput.addEventListener('keydown', e => { if(e.key === 'Enter') submitPass(); });

async function submitPass(){
  const val = passInput.value;
  if(!val){ return; }
  if(editPasscode){
    if(val !== editPasscode){
      passModalError.classList.add('show');
      return;
    }
  } else {
    try{ await window.storage.set(PASS_KEY, val, true); }catch(e){}
    editPasscode = val;
  }
  isEditMode = true;
  closePassModal();
  updateEditUI();
  buildTabPills();
  buildCatPills();
  render();
}

function updateEditUI(){
  editToggle.classList.toggle('active', isEditMode);
  editToggle.innerHTML = isEditMode ? '🔓 Editing — tap to lock' : '🔒 Edit';
  statusDot.classList.toggle('editing', isEditMode);
}

loadData();

</script>

</body></html>
